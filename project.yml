name: MicroPulse
options:
  bundleIdPrefix: com.la0x
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"           # iPhone
    # DEVELOPMENT_TEAM is set in Xcode (Signing & Capabilities → your Apple ID).

targets:
  MicroPulse:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.la0x.micropulse
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: micro-pulse
        NSBluetoothAlwaysUsageDescription: "micro-pulse connects to your Pulse ring to set the vibration interval and pattern."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
