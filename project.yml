name: MicroPulse
options:
  bundleIdPrefix: com.la0x
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"           # iPhone
    # The paid Apple Developer Program team. It belongs here and not only in
    # Xcode's Signing & Capabilities, because this project is generated: a
    # `xcodegen generate` would drop a team set by hand, and the build would
    # fall back to a free personal team whose profile dies after seven days.
    DEVELOPMENT_TEAM: GUGQ9MB76A

targets:
  MicroPulse:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.la0x.micropulse
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: micro-pulse
        NSBluetoothAlwaysUsageDescription: "micro-pulse connects to your Pulse ring to set the vibration interval and pattern."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
